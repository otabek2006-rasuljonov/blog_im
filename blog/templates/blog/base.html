<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog IM{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="{% url 'post_list' %}" class="brand">Blog IM</a>
            <ul class="nav-links">
                <li>
                    <a href="{% url 'post_list' %}" class="{% if request.resolver_match.url_name == 'post_list' %}active{% endif %}">
                        <i class="ri-article-line"></i> Posts
                    </a>
                </li>
                <li>
                    <a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                        <i class="ri-user-line"></i> About
                    </a>
                </li>
                <li>
                    <a href="{% url 'connection' %}" class="{% if request.resolver_match.url_name == 'connection' %}active{% endif %}">
                        <i class="ri-links-line"></i> Connection
                    </a>
                </li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <i class="ri-menu-line"></i>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <span>&copy; {% now "Y" %} Blog IM. Barcha huquqlar himoyalangan.</span>
        </div>
    </footer>

    <script>
        const toggle = document.getElementById('navToggle');
        const navLinks = document.querySelector('.nav-links');
        if (toggle) {
            toggle.addEventListener('click', () => {
                navLinks.classList.toggle('open');
            });
        }
    </script>
</body>
</html>
